[project]
name = "inference-provider-proxy"
version = "0.1.0"
description = "A LAN proxy that owns a single provider key, serializes chat requests, and exposes an OpenAI-compatible surface plus a session dashboard."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "pydantic-settings==2.16.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
ipp = "inference_provider_proxy.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "archunitpython==1.8.1",
    "jsonschema>=4.26.0",
    "langchain-openai==1.7.2",
    "langgraph==1.2.15",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=7.1.0",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.pytest.ini_options]
testpaths = ["qa"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing:skip-covered"
markers = [
    "e2e: hits the real provider through a running proxy, off by default",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py315"
line-length = 100
exclude = [".specify", ".agents", ".venv", "qa/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
