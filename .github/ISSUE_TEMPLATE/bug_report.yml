name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill this out. Never paste `.env` values or provider API keys; redact anything secret before submitting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behaviour, including error text, HTTP status, or dashboard output.
      placeholder: The request returned 502 and the dashboard showed errors.by_kind...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How do you trigger this? Walk through it step by step.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant proxy or client log output. Redact anything secret; it will be formatted as code automatically.
      render: shell
    validations:
      required: false
