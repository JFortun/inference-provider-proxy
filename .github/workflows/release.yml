name: Release

# Cutting a release: run this workflow from the Actions tab and pick major,
# minor or patch from the dropdown; everything else is automatic.
#
# The bump job commits the new version to pyproject.toml and uv.lock on main
# (authenticated with RELEASE_PUSH_TOKEN so the branch ruleset lets it
# through), then tags that commit. The rest of the run builds the wheel and
# the sdist, publishes the release with generated notes, and deploys.
#
# This dispatch is the only trigger: a hand-published release or a manual tag
# push does nothing. Recover a run that failed partway with Re-run failed
# jobs, which reuses the bump outputs so the version is never advanced twice.
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Version component to bump
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump the version and tag it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the push authenticates with RELEASE_PUSH_TOKEN instead
    outputs:
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Compute the release version
        id: target
        env:
          RELEASE_TYPE: ${{ inputs['release-type'] }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import subprocess
          import sys

          def bump(version, kind):
              x, y, z = (int(part) for part in version.split("."))
              if kind == "major":
                  return f"{x + 1}.0.0"
              if kind == "minor":
                  return f"{x}.{y + 1}.0"
              return f"{x}.{y}.{z + 1}"

          def key(version):
              return tuple(int(part) for part in version.split("."))

          kind = os.environ["RELEASE_TYPE"]
          declared = subprocess.run(
              ["uv", "version", "--short"], capture_output=True, text=True, check=True
          ).stdout.strip()
          released = [
              tag[1:]
              for tag in subprocess.run(
                  ["git", "tag", "--list", "v*"], capture_output=True, text=True, check=True
              ).stdout.split()
              if re.fullmatch(r"v\d+\.\d+\.\d+", tag)
          ]
          latest = max(released, key=key) if released else None
          if latest is None:
              target = bump(declared, kind)
          elif key(declared) > key(latest):
              target = declared
          else:
              target = bump(latest, kind)
          print(
              f"declared {declared}, latest release {latest or 'none'}, {kind} -> {target}",
              file=sys.stderr,
          )
          print(f"version={target}")
          print(f"tag=v{target}")
          PY

      - name: Bump pyproject and tag the commit
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${RELEASE_TAG} already exists; if an earlier run stopped after tagging, use Re-run failed jobs, otherwise dispatch a bigger bump"
            exit 1
          fi
          if [ "$(uv version --short)" != "$version" ]; then
            uv version "$version"
            git add pyproject.toml uv.lock
            git commit -m "chore(release): bump version to ${version}"
            git push origin HEAD:main
          fi
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
          echo "tagged ${RELEASE_TAG} on $(git rev-parse --short HEAD)"

  attach-distributions:
    name: Attach distributions
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload the wheel and the sdist
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Stamp the tag version onto the checkout
        env:
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          declared="$(uv version --short)"
          if [ "$declared" != "$version" ]; then
            echo "::warning::Tag '$RELEASE_TAG' ships $version but pyproject.toml declares $declared; stamping the checkout"
            echo "Tag \`$RELEASE_TAG\` ships \`$version\`; pyproject.toml declared \`$declared\` (stamped for this build)." >> "$GITHUB_STEP_SUMMARY"
            uv version "$version"
          fi
          echo "building release $version (pyproject $(uv version --short))"

      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Build the wheel and the sdist
        run: uv build

      - name: Attach the distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  deploy:
    name: Deploy
    needs: attach-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy
    environment: production # creates a deployment record per release, no URL attached
    permissions:
      deployments: write # let the run publish its own deployment statuses
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Install the deploy CLI
        run: curl -fsSL https://cli-src.webdock.tech/install/linux.sh | sudo bash

      - name: Authenticate the deploy CLI
        env:
          WEBDOCK_TOKEN: ${{ secrets.WEBDOCK_API_TOKEN }}
        run: webdock init -t "$WEBDOCK_TOKEN"

      - name: Render the deploy script
        env:
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
          UPSTREAM_URL: ${{ secrets.IPP_UPSTREAM_BASE_URL }}
          UPSTREAM_KEY: ${{ secrets.IPP_UPSTREAM_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          python_version = pathlib.Path(".python-version").read_text().strip()
          if not python_version:
              raise SystemExit(".python-version is empty")
          rendered = pathlib.Path(".github/deploy/deploy.sh").read_text()
          rendered = rendered.replace("{{VERSION}}", version)
          rendered = rendered.replace("{{PYTHON_VERSION}}", python_version)
          rendered = rendered.replace("{{UPSTREAM_URL}}", os.environ["UPSTREAM_URL"])
          rendered = rendered.replace("{{UPSTREAM_KEY}}", os.environ["UPSTREAM_KEY"])
          if "{{" in rendered:
              raise SystemExit("unrendered placeholder left in the deploy script")
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "deploy.sh"
          out.write_text(rendered)
          print(f"rendered {out.name} for version {version} on python {python_version}")
          PY

      - name: Push the deploy script to the server
        env:
          SLUG: ${{ secrets.WEBDOCK_SERVER_SLUG }}
        run: |
          set -euo pipefail
          content="$(cat "$RUNNER_TEMP/deploy.sh")"
          id="$(webdock scripts list --json | jq -r '[.body[] | select(.name == "ipp-deploy")][0].id // empty')"
          if [ -n "$id" ]; then
            webdock scripts update "$id" "ipp-deploy" "ipp-deploy.sh" "$content" --json >/dev/null
          else
            webdock scripts create "ipp-deploy" "ipp-deploy.sh" "$content" --json >/dev/null
            id="$(webdock scripts list --json | jq -r '[.body[] | select(.name == "ipp-deploy")][0].id // empty')"
          fi
          test -n "$id"
          webdock scripts server-create "$SLUG" "$id" /root/ipp-deploy.sh --executable >/dev/null
          echo "SCRIPT_ID=$id" >> "$GITHUB_ENV"

      - name: Execute the deploy script on the server
        env:
          SLUG: ${{ secrets.WEBDOCK_SERVER_SLUG }}
        run: |
          set -euo pipefail
          sid="$(webdock scripts server-list "$SLUG" --json | jq -r '[.body[] | select(.path == "/root/ipp-deploy.sh")][0].id // empty')"
          if [ -z "$sid" ]; then
            echo "::error::deploy script was not pushed to the server"
            exit 1
          fi
          webdock scripts server-execute "$SLUG" "$sid" --wait

      - name: Verify the execution result
        env:
          SLUG: ${{ secrets.WEBDOCK_SERVER_SLUG }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cb="$(webdock scripts server-list "$SLUG" --json | jq -r '[.body[] | select(.path == "/root/ipp-deploy.sh")][0].lastRunCallbackId // empty')"
          if [ -z "$cb" ]; then
            echo "::error::no recorded run for the deploy script"
            exit 1
          fi
          ev="$(webdock events list --json -l 30 -y execute-file | jq -c --arg cb "$cb" '[.body[] | select(.callbackId == $cb)][0] // empty')"
          if [ -z "$ev" ]; then
            echo "::error::execution event not found"
            exit 1
          fi
          status="$(jq -r '.status' <<<"$ev")"
          message="$(jq -r '.message // ""' <<<"$ev")"
          if [ -n "$message" ]; then
            printf '%s\n' "$message"
          fi
          if [ "$status" != "finished" ]; then
            echo "::error::deploy script ended with status '$status'"
            exit 1
          fi
          if ! grep -F "DEPLOY OK $version" <<<"$message" >/dev/null; then
            echo "::warning::status is finished but no 'DEPLOY OK $version' marker was returned in the event message"
          fi

      - name: Verify the new version is serving
        env:
          PROBE_URL: ${{ secrets.DEPLOY_PROBE_URL }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          for i in $(seq 1 30); do
            body="$(curl -fsS --max-time 10 "$PROBE_URL/dashboard" 2>/dev/null || true)"
            got="$(jq -r '.session.package_version // empty' <<<"$body" 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "verified: package_version=$got"
              exit 0
            fi
            echo "attempt $i: got '${got:-none}', want '$want'"
            sleep 5
          done
          echo "::error::service never reported version $want"
          exit 1
