name: Release

on:
  release:
    types: [published]

jobs:
  attach-distributions:
    name: Attach distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the wheel and the sdist as release assets
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Check the tag matches the project version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the pyproject.toml version '$version'"
            exit 1
          fi

      - name: Generate release notes when none were written
        if: github.event.release.body == null || github.event.release.body == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --generate-notes

      - name: Build the wheel and the sdist
        run: uv build

      - name: Attach the distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
